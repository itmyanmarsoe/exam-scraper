<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>မြန်မာနိုင်ငံ စာမေးပွဲရလာဒ်များ</title>
    <!-- Tailwind v4 CDN -->
    <script src="https://unpkg.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <!-- Babel CDN (For JSX compilation in browser) -->
    <script src="https://unpkg.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com"></script>
    <!-- Custom Font Configuration -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased selection:bg-zinc-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Repository Paths
        const REPO_URL = "https://github.com";
        const RAW_BASE_URL = "https://githubusercontent.com";
        const CURRENT_YEAR = new Date().getFullYear().toString();
        const DATA_URL = `${RAW_BASE_URL}/${CURRENT_YEAR}.json`;
        function App() {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            
            const [selectedRegion, setSelectedRegion] = useState(null);
            const [regionSearch, setRegionSearch] = useState("");
            const [districtSearch, setDistrictSearch] = useState("");

            // Repository ထဲမှ JSON ဒေတာကို ဖတ်ခြင်း
            useEffect(() => {
                fetch(DATA_URL)
                    .then(res => {
                        if (!res.ok) throw new Error("ယခုနှစ်အတွက် အောင်စာရင်း Data မတွေ့ရှိသေးပါ။");
                        return res.json();
                    })
                    .then(json => {
                        setData(json);
                        setLoading(false);
                    })
                    .catch(err => {
                        setError(err.message);
                        setLoading(false);
                    });
            }, []);

            // Icon များ ပုံမှန်အလုပ်လုပ်ရန် စစ်ဆေးခြင်း
            useEffect(() => {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }, [data, selectedRegion, regionSearch, districtSearch, loading, error]);

            // တိုင်းဒေသကြီးများကို Filter လုပ်ခြင်း
            const filteredRegions = useMemo(() => {
                return data.filter(r => 
                    r.region.toLowerCase().includes(regionSearch.toLowerCase())
                );
            }, [data, regionSearch]);

            // ခရိုင်၊ စာစစ်ဌာန၊ အက္ခရာများအားလုံးကို Filter လုပ်ခြင်း
            const filteredDistricts = useMemo(() => {
                if (!selectedRegion) return [];
                const search = districtSearch.toLowerCase();
                return selectedRegion.districts.filter(d => 
                    d.name.toLowerCase().includes(search) ||
                    d.department.toLowerCase().includes(search) ||
                    d.alphabet.toLowerCase().includes(search)
                );
            }, [selectedRegion, districtSearch]);

            // View နှင့် Download URL သတ်မှတ်ခြင်း
            const getPdfUrls = (filePath) => {
                const fullPath = `${CURRENT_YEAR}/${filePath}`;
                const rawPdfUrl = `${RAW_BASE_URL}/${fullPath}`;
                const viewUrl = `https://google.com{encodeURIComponent(rawPdfUrl)}`;
                return { downloadUrl: rawPdfUrl, viewUrl };
            };
            if (loading) {
                return (
                    <div class="flex flex-col items-center justify-center min-h-screen p-4">
                        <div class="w-8 h-8 border-4 border-zinc-900 border-t-transparent rounded-full animate-spin"></div>
                        <p class="mt-4 text-sm text-zinc-500 font-medium">ဒေတာများ ရယူနေပါသည်...</p>
                    </div>
                );
            }

            if (error) {
                return (
                    <div class="flex flex-col items-center justify-center min-h-screen p-4 text-center">
                        <div class="p-3 bg-red-50 text-red-600 rounded-full mb-3">
                            <i data-lucide="alert-circle" class="w-6 h-6"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-zinc-900">အမှားအယွင်း ရှိခဲ့ပါသည်</h3>
                        <p class="mt-1 text-sm text-zinc-500 max-w-sm">{error}</p>
                    </div>
                );
            }

            return (
                <div class="max-w-md mx-auto min-h-screen flex flex-col bg-white border-x border-zinc-100 shadow-sm">
                    {/* Header */}
                    <header class="sticky top-0 z-10 bg-white/80 backdrop-blur-md border-b border-zinc-100 p-4 flex items-center justify-between">
                        {selectedRegion ? (
                            <button 
                                onClick={() => { setSelectedRegion(null); setDistrictSearch(""); }}
                                class="inline-flex items-center justify-center w-9 h-9 rounded-md border border-zinc-200 hover:bg-zinc-50 transition-colors"
                            >
                                <i data-lucide="chevron-left" class="w-4 h-4"></i>
                            </button>
                        ) : (
                            <div class="inline-flex items-center justify-center w-9 h-9 bg-zinc-900 text-white rounded-md">
                                <i data-lucide="graduation-cap" class="w-4 h-4"></i>
                            </div>
                        )}
                        <h1 class="text-base font-semibold tracking-tight text-zinc-900 text-center flex-1">
                            {selectedRegion ? selectedRegion.region : `စာမေးပွဲရလာဒ်များ (${CURRENT_YEAR})`}
                        </h1>
                        <div class="w-9"></div>
                    </header>
                    {/* Main Content */}
                    <main class="flex-1 p-4">
                        {!selectedRegion ? (
                            /* HOME PAGE: REGION LIST */
                            <div class="space-y-4">
                                <div class="relative">
                                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400"></i>
                                    <input 
                                        type="text" 
                                        placeholder="တိုင်းဒေသကြီး / ပြည်နယ် ရှာရန်..." 
                                        value={regionSearch}
                                        onChange={(e) => setRegionSearch(e.target.value)}
                                        class="w-full pl-9 pr-4 py-2 text-sm bg-zinc-50 border border-zinc-200 rounded-md focus:outline-none focus:border-zinc-400 focus:bg-white transition-all placeholder:text-zinc-400"
                                    />
                                </div>

                                <div class="grid grid-cols-1 gap-2">
                                    {filteredRegions.length > 0 ? (
                                        filteredRegions.map((r, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => setSelectedRegion(r)}
                                                class="flex items-center justify-between p-3.5 border border-zinc-200 rounded-lg hover:bg-zinc-50 transition-colors text-left group"
                                            >
                                                <div class="space-y-0.5">
                                                    <div class="text-sm font-medium text-zinc-900">{r.region}</div>
                                                    <div class="text-xs text-zinc-400">{r.districts.length} စာစစ်ဌာနစုစုပေါင်း</div>
                                                </div>
                                                <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-400 group-hover:text-zinc-600 transition-colors"></i>
                                            </button>
                                        ))
                                    ) : (
                                        <p class="text-center py-8 text-sm text-zinc-400">ရှာဖွေမှုမတွေ့ရှိပါ။</p>
                                    )}
                                </div>
                            </div>
                        ) : (
                            /* DETAIL PAGE: DISTRICTS LIST */
                            <div class="space-y-4">
                                <div class="relative">
                                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400"></i>
                                    <input 
                                        type="text" 
                                        placeholder="ခရိုင်၊ စာစစ်ဌာန သို့မဟုတ် အက္ခရာဖြင့် ရှာရန်..." 
                                        value={districtSearch}
                                        onChange={(e) => setDistrictSearch(e.target.value)}
                                        class="w-full pl-9 pr-4 py-2 text-sm bg-zinc-50 border border-zinc-200 rounded-md focus:outline-none focus:border-zinc-400 focus:bg-white transition-all placeholder:text-zinc-400"
                                    />
                                </div>

                                <div class="space-y-3">
                                    {filteredDistricts.length > 0 ? (
                                        filteredDistricts.map((d, idx) => {
                                            const urls = getPdfUrls(d.file);
                                            return (
                                                <div key={idx} class="p-4 border border-zinc-200 rounded-xl space-y-3 bg-white shadow-xs">
                                                    <div>
                                                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-zinc-100 text-zinc-800 mb-1.5">
                                                            {d.name}ခရိုင်
                                                        </span>
                                                        <h3 class="text-sm font-semibold text-zinc-900 leading-snug">{d.department}</h3>
                                                        <p class="text-xs text-zinc-500 mt-0.5">စာမေးပွဲခုံအက္ခရာ - <span class="font-medium text-zinc-700">{d.alphabet}</span></p>
                                                    </div>
                                                    
                                                    <div class="grid grid-cols-2 gap-2 pt-1">
                                                        <a 
                                                            href={urls.viewUrl} 
                                                            target="_blank" 
                                                            rel="noopener noreferrer"
                                                            class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 text-xs font-medium border border-zinc-200 rounded-md hover:bg-zinc-50 text-zinc-700 transition-colors"
                                                        >
                                                            <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                                            ဖတ်ရန်
                                                        </a>
                                                        <a 
                                                            href={urls.downloadUrl} 
                                                            download
                                                            target="_blank"
                                                            class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 text-xs font-medium bg-zinc-900 text-white rounded-md hover:bg-zinc-800 transition-colors"
                                                        >
                                                            <i data-lucide="download" class="w-3.5 h-3.5"></i>
                                                            ဒေါင်းလုဒ်
                                                        </a>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    ) : (
                                        <p class="text-center py-8 text-sm text-zinc-400">ရှာဖွေမှုမတွေ့ရှိပါ။</p>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                    {/* Footer */}
                    <footer class="p-4 border-t border-zinc-100 bg-zinc-50/50 text-center">
                        <p class="text-xs text-zinc-400">Data source: myanmarexam.org</p>
                    </footer>
                </div>
            );
        }

        // App အား စတင် Render လုပ်ခြင်း
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
